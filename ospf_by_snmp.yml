zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 57b7ae836ca64446ba2c296389c009b7
      name: 'Templates/Network modules'
  templates:
    - uuid: c04be2cb532342859d8bc538c8f72cd4
      template: 'OSPF by SNMP'
      name: 'OSPF by SNMP'
      description: |
        Template for monitoring the OSPF process by SNMP.
        
        Author: Jorn Ivar Holland
      groups:
        - name: 'Templates/Network modules'
      items:
        - uuid: 2683f9a2bc8c4e78a90f49acc61fff0f
          name: 'SNMP walk OSPF neighbors'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.14.10.1.1,1.3.6.1.2.1.14.10.1.3,1.3.6.1.2.1.14.10.1.6,1.3.6.1.2.1.14.10.1.7]'
          key: ospf.neighbor.walk
          history: '0'
          value_type: TEXT
          description: |
            Discover OSPF neighbors:
            1.3.6.1.2.1.14.10.1.1 = neighbor IP
            1.3.6.1.2.1.14.10.1.3 = neighbor router id
            1.3.6.1.2.1.14.10.1.6 = neighbor relationship state
            1.3.6.1.2.1.14.10.1.7 = neighbor relationship changes
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: 2612ed69140d4ecb89671b451947e7db
          name: 'OSPF neighbor discovery'
          type: DEPENDENT
          key: ospf.neighbor.discovery
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            Discover OSPF neighbors.
            
            Lost neighbors are not immediately disabled by the discovery rule. Instead, their relationship state is set to unknown, while the last router ID and the number of relationship changes are preserved. This behavior is intended to prevent items and triggers from being immediately disabled when a discovered OSPF neighbor goes down and its associated SNMP OIDs are no longer discovered. In such cases, the SNMP OIDs are removed rather than reporting the neighbor's state as down, which would otherwise cause the discovery rule to immediately disable the associated items and triggers.
          item_prototypes:
            - uuid: 02f7231af39442aeb7476f1923e59225
              name: 'OSPF neighbor {#OSPF_NEIGHBOR} number of relationship changes'
              type: DEPENDENT
              key: 'ospf.neighbor.changes[ospfNbrEvents.{#SNMPINDEX}]'
              description: 'The number of times this neighbor relationship has changed state, or an error has occurred.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.14.10.1.7.{#SNMPINDEX}'
                    - '0'
                  error_handler: DISCARD_VALUE
              master_item:
                key: ospf.neighbor.walk
              tags:
                - tag: component
                  value: network
                - tag: component
                  value: ospf
              trigger_prototypes:
                - uuid: 9f68d84a850345179f5cdde4caf03a7e
                  expression: 'change(/OSPF by SNMP/ospf.neighbor.changes[ospfNbrEvents.{#SNMPINDEX}])=1'
                  name: 'OSPF: Neighbor {#OSPF_NEIGHBOR} has changed relationship'
                  priority: INFO
                  description: 'The relationship with OSPF neighbor {#OSPF_NEIGHBOR} has changed. Acknowledge to close the problem manually.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: ecdd55b9e3dc499bbeb30cd1e2905dd6
              name: 'OSPF neighbor {#OSPF_NEIGHBOR} router id'
              type: DEPENDENT
              key: 'ospf.neighbor.id[ospfNbrRtrId.{#SNMPINDEX}]'
              value_type: TEXT
              description: 'A 32-bit integer uniquely identifying the neighboring router in the Autonomous System.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.14.10.1.3.{#SNMPINDEX}'
                    - '0'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: ospf.neighbor.walk
              tags:
                - tag: component
                  value: network
                - tag: component
                  value: ospf
              trigger_prototypes:
                - uuid: aa99fa32718c408b9ab4c2c4f6fc9165
                  expression: 'change(/OSPF by SNMP/ospf.neighbor.id[ospfNbrRtrId.{#SNMPINDEX}])=1 and length(last(/OSPF by SNMP/ospf.neighbor.id[ospfNbrRtrId.{#SNMPINDEX}]))>0'
                  name: 'OSPF: Neighbor {#OSPF_NEIGHBOR} changed router id'
                  priority: INFO
                  description: 'OSPF neighbor {#OSPF_NEIGHBOR} changed router id. Acknowledge to close the problem manually.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: de1e97b525a649b195ce72c1e134312e
              name: 'OSPF neighbor {#OSPF_NEIGHBOR} relationship state'
              type: DEPENDENT
              key: 'ospf.neighbor.state[ospfNbrState.{#SNMPINDEX}]'
              trends: '0'
              description: 'The State of the relationship with this Neighbor.'
              valuemap:
                name: 'OSPF neighbor state'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.14.10.1.6.{#SNMPINDEX}'
                    - '0'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: ospf.neighbor.walk
              tags:
                - tag: component
                  value: health
                - tag: component
                  value: network
                - tag: component
                  value: ospf
              trigger_prototypes:
                - uuid: ff7c1f339ced4420a02fa5f04e24de89
                  expression: |
                    last(/OSPF by SNMP/ospf.neighbor.state[ospfNbrState.{#SNMPINDEX}])<>8
                    and last(/OSPF by SNMP/ospf.neighbor.state[ospfNbrState.{#SNMPINDEX}])<>4
                  name: 'OSPF: Neighbor {#OSPF_NEIGHBOR} adjacency is not established'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'Please check the OSPF neighbor state for router ID {#OSPF_NEIGHBOR}.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: ospf.neighbor.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#OSPF_NEIGHBOR}'
                - 1.3.6.1.2.1.14.10.1.1
                - '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 2h
      tags:
        - tag: class
          value: network
        - tag: target
          value: ospf
      valuemaps:
        - uuid: 78ba3ab99b5346a7828a2ab217539396
          name: 'OSPF neighbor state'
          mappings:
            - value: '1'
              newvalue: Down
            - value: '2'
              newvalue: Attempt
            - value: '3'
              newvalue: Init
            - value: '4'
              newvalue: 'Two way'
            - value: '5'
              newvalue: 'Exchange start'
            - value: '6'
              newvalue: Exchange
            - value: '7'
              newvalue: Loading
            - value: '8'
              newvalue: Full
            - value: '0'
              newvalue: Unknown
